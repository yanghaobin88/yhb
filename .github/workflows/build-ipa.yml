name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project LocationPilot.xcodeproj \
            -scheme LocationPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "===== BUILD FAILED (exit $st) ====="
            grep -nE "error: |fatal error|Undefined symbols|\.app: error" build.log | head -25 | while IFS= read -r line; do
              echo "::error title=xcodebuild::$line"
            done
            echo "===== TAIL 80 ====="
            tail -n 80 build.log
          fi
          exit "$st"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package into .ipa
        if: success()
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LocationPilot.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" -print
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry LocationPilot.ipa Payload
          ls -lh LocationPilot.ipa

      - name: Publish IPA to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocationPilot unsigned ipa #${{ github.run_number }}
          prerelease: true
          files: out/LocationPilot.ipa
