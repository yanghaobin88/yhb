name: Build IPA (unsigned + TrollStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project LocationPilot.xcodeproj \
            -scheme LocationPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "===== BUILD FAILED (exit $st) ====="
            grep -nE "error: |fatal error|Undefined symbols|\.app: error" build.log | head -25 | while IFS= read -r line; do
              echo "::error title=xcodebuild::$line"
            done
            echo "===== TAIL 80 ====="
            tail -n 80 build.log
          fi
          exit "$st"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install ldid
        if: success()
        run: |
          brew install ldid
          ldid -v || true

      - name: Package unsigned .ipa and TrollStore .tipa
        if: success()
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LocationPilot.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" -print
            exit 1
          fi

          ENT="$GITHUB_WORKSPACE/LocationPilot.entitlements"
          test -f "$ENT" || { echo "::error::缺少 LocationPilot.entitlements"; exit 1; }

          # ---------- 1) 未签名 ipa（通用兜底） ----------
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          ( cd out && zip -qry LocationPilot-unsigned.ipa Payload )

          # ---------- 2) TrollStore 签名版（注入 locationd.simulation 权限） ----------
          mkdir -p troll/Payload
          cp -R "$APP_PATH" troll/Payload/
          BIN="troll/Payload/LocationPilot.app/LocationPilot"
          ldid -S"$ENT" "$BIN"
          echo "----- 已写入的 entitlements -----"
          ldid -e "$BIN"
          if ldid -e "$BIN" | grep -q "locationd.simulation"; then
            echo "OK: com.apple.locationd.simulation 已注入"
          else
            echo "::error title=entitlements::ldid 未能写入 com.apple.locationd.simulation"
            exit 1
          fi
          # 顺手把 entitlements 放进包里，方便排查
          cp "$ENT" "troll/Payload/LocationPilot.app/LocationPilot.entitlements"
          ( cd troll && zip -qry LocationPilot.tipa Payload )

          ls -lh out/LocationPilot-unsigned.ipa troll/LocationPilot.tipa

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocationPilot build #${{ github.run_number }}
          prerelease: true
          files: |
            out/LocationPilot-unsigned.ipa
            troll/LocationPilot.tipa

      - name: Publish tipa (base64) to dist branch
        if: success()
        run: |
          set -euo pipefail
          base64 -i troll/LocationPilot.tipa | tr -d '\n' > /tmp/LocationPilot.tipa.b64
          ls -lh /tmp/LocationPilot.tipa.b64
          git fetch origin dist || true
          git worktree add /tmp/distwt --detach
          cd /tmp/distwt
          git checkout --orphan distnew
          git rm -rf . -q || true
          mkdir -p dist
          cp /tmp/LocationPilot.tipa.b64 dist/LocationPilot.tipa.b64
          git add -f dist/LocationPilot.tipa.b64
          git -c user.name=actions -c user.email=actions@github.com commit -q -m "tipa base64 build ${{ github.run_number }}"
          git push -f origin HEAD:dist
