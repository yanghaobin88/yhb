name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LocationPilot.xcodeproj \
            -scheme LocationPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LocationPilot.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" -print
            exit 1
          fi
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry LocationPilot.ipa Payload
          ls -lh LocationPilot.ipa
          unzip -l LocationPilot.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationPilot-ipa
          path: out/LocationPilot.ipa
          if-no-files-found: error
          retention-days: 30
